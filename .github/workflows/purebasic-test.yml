name: PureBasic NanoMsg Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Download PureBasic Demo Version
      shell: powershell
      run: |
        $url = "https://www.purebasic.com/download/PureBasic_Demo_x64.exe"
        $installer = "$env:TEMP\PureBasic_Demo_x64.exe"
        $installDir = "C:\Program Files\PureBasic"

        Write-Host "Downloading PureBasic Demo..."
        Invoke-WebRequest -Uri $url -OutFile $installer

        Write-Host "Static Installation in Progress (Silent Install)..."
        Start-Process -FilePath $installer -ArgumentList "/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=`"$installDir`"" -Wait

        if (Test-Path "$installDir\Compilers") {
            Write-Host "PureBasic Installed Successfully!"
            echo "$installDir\Compilers" >> $env:GITHUB_PATH
        } else {
            Write-Error "PureBasic Installation Failed; Compiler Directory Not Found."
            exit 1
        }

    - name: Verify if the PureBasic Compiler is Available
      shell: powershell
      run: |
        $compiler = Get-Command pbcompiler -ErrorAction Stop

        Write-Host "Found:"
        Write-Host $compiler.Source

    - name: Compile Examples
      shell: powershell
      run: |
        $exampleDir = "PureBasicNanoMsg/Example"
        Set-Location $exampleDir

        $outDir = Join-Path (Get-Location) "_ci_out"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null

        $files = @(
          "Nanomsg.pb",
          "PubServer.pb",
          "SubClient.pb",
          "RepServer.pb",
          "ReqClient.pb",
          "PushServer.pb",
          "PullClient.pb",
          "SurveyorServer.pb",
          "RespondentClient.pb",
          "BusServer.pb",
          "BusClient.pb",
          "PairInproc.pb",
          "SendmsgIovec.pb",
          "Module/PubServer.pb",
          "Module/SubClient.pb",
          "Module/RepServer.pb",
          "Module/ReqClient.pb",
          "Module/PushServer.pb",
          "Module/PullClient.pb",
          "Module/SurveyorServer.pb",
          "Module/RespondentClient.pb",
          "Module/BusServer.pb",
          "Module/BusClient.pb",
          "Module/PairInproc.pb",
          "Module/SendmsgIovec.pb"
        )

        $failed = @()

        foreach ($f in $files) {
          $name = ($f -replace '[\\/]', '-').Replace('.pb', '')
          $dst = Join-Path $outDir "$name.exe"

          Write-Host "=== Compiling $f ==="
          & pbcompiler $f /OUTPUT $dst /QUIET

          if (-not (Test-Path $dst)) {
            Write-Host "FAILED: $f"
            $failed += $f
          } else {
            Write-Host "OK: $f"
          }
        }

        if ($failed.Count -gt 0) {
          Write-Error ("Compilation failed for: " + ($failed -join ", "))
          exit 1
        }

        Write-Host "All $($files.Count) nanomsg examples compiled successfully."

    - name: Compile NNG Examples
      shell: powershell
      run: |
        $exampleDir = "PureBasicNNG/Example"
        Set-Location $exampleDir

        $outDir = Join-Path (Get-Location) "_ci_out"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null

        $files = @(
          "Nng.pb",
          "PubServer.pb",
          "SubClient.pb",
          "RepServer.pb",
          "ReqClient.pb",
          "PushServer.pb",
          "PullClient.pb",
          "SurveyorServer.pb",
          "RespondentClient.pb",
          "PairInproc.pb",
          "Module/Message.pb",
          "Module/PubServer.pb",
          "Module/SubClient.pb",
          "Module/RepServer.pb",
          "Module/ReqClient.pb",
          "Module/PushServer.pb",
          "Module/PullClient.pb",
          "Module/SurveyorServer.pb",
          "Module/RespondentClient.pb",
          "Module/PairInproc.pb"
        )

        $failed = @()

        foreach ($f in $files) {
          $name = ($f -replace '[\\/]', '-').Replace('.pb', '')
          $dst = Join-Path $outDir "$name.exe"

          Write-Host "=== Compiling $f ==="
          & pbcompiler $f /OUTPUT $dst /QUIET

          if (-not (Test-Path $dst)) {
            Write-Host "FAILED: $f"
            $failed += $f
          } else {
            Write-Host "OK: $f"
          }
        }

        if ($failed.Count -gt 0) {
          Write-Error ("Compilation failed for: " + ($failed -join ", "))
          exit 1
        }

        Write-Host "All $($files.Count) NNG examples compiled successfully."

    - name: Run NNG PairInproc Smoke Test
      shell: powershell
      run: |
        $root = Resolve-Path "PureBasicNNG"
        $exe = Join-Path $root "Example\_ci_out\Module-PairInproc.exe"
        Set-Location $root
        " " | & $exe
        if ($LASTEXITCODE -ne 0) {
          Write-Error "PairInproc smoke test failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
        Write-Host "PairInproc smoke test passed."
